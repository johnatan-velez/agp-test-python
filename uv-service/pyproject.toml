[project]
name = "analytics-pipeline"
version = "0.5.0"
description = "Real-time analytics data pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0,<0.96.0",
    "uvicorn[standard]>=0.21.0,<0.22.0",
    "sqlalchemy>=1.4.46,<1.5.0",
    "httpx>=0.23.3,<0.24.0",
    "pydantic>=1.10.4,<2.0.0",
    "cryptography>=39.0.0,<40.0.0",
    "pillow>=9.3.0,<10.0.0",
    "requests>=2.28.0,<2.29.0",
    "boto3>=1.26.0,<1.27.0",
    "aiohttp>=3.8.3,<3.9.0",
    "urllib3>=1.26.14,<1.27.0",
    "click>=8.1.3,<8.2.0",
    "rich>=13.3.0,<13.4.0",
    "structlog>=23.1.0,<23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.0.254",
    "mypy>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.2.0",
    "pytest-asyncio>=0.20.0",
    "ruff>=0.0.254",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
