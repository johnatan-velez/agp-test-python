version = 1
requires-python = ">=3.10"

[[package]]
name = "analytics-pipeline"
version = "0.5.0"
source = { editable = "." }
dependencies = [
    { name = "fastapi" },
    { name = "uvicorn", extras = ["standard"] },
    { name = "sqlalchemy" },
    { name = "httpx" },
    { name = "pydantic" },
    { name = "cryptography" },
    { name = "pillow" },
    { name = "requests" },
    { name = "boto3" },
    { name = "aiohttp" },
    { name = "urllib3" },
    { name = "click" },
    { name = "rich" },
    { name = "structlog" },
]

