[tool.poetry]
name = "inventory-service"
version = "1.2.0"
description = "Enterprise inventory management microservice"
authors = ["Platform Team <platform@acmecorp.io>"]
readme = "README.md"
packages = [{include = "inventory"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "0.95.0"
uvicorn = {version = "0.21.0", extras = ["standard"]}
sqlalchemy = "1.4.46"
pydantic = "1.10.4"
httpx = "0.23.3"
celery = "5.2.7"
redis = "4.4.0"
cryptography = "39.0.0"
pillow = "9.3.0"
requests = "2.28.0"
jinja2 = "3.1.2"
aiohttp = "3.8.3"
urllib3 = "1.26.14"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
pytest-asyncio = "^0.20.0"
black = "^23.1.0"
mypy = "^1.0.0"
ruff = "^0.0.254"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
